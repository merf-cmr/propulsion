<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6B3FA0">
  <title>Propulsion — Hors ligne</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #F4F4F8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .icon { font-size: 64px; margin-bottom: 24px; }
    h1 { color: #1A1A2E; font-size: 22px; font-weight: 700; margin-bottom: 12px; }
    p { color: #6b7280; font-size: 15px; line-height: 1.6; max-width: 300px; }
    .btn {
      margin-top: 32px;
      background: #6B3FA0;
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>Pas de connexion internet</h1>
  <p>Propulsion nécessite une connexion pour afficher les membres et les annonces. Vérifie ta connexion et réessaie.</p>
  <button class="btn" onclick="window.location.reload()">Réessayer</button>
</body>
</html>
